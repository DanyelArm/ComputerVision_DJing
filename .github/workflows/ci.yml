name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.24"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.24"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker:
    name: Docker build & smoke test
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t cvdj:ci .
      - name: Start container and wait until healthy
        run: |
          docker run -d --name cvdj -p 8000:8000 cvdj:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' cvdj)
            echo "attempt $i: $status"
            if [ "$status" = "healthy" ]; then
              curl --fail --silent http://localhost:8000/health
              exit 0
            fi
            sleep 2
          done
          docker logs cvdj
          exit 1
